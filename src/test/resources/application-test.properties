# ═══════════════════════════════════════════════
#  TEST PROFILE CONFIGURATION
# ═══════════════════════════════════════════════

# ─── TEST DB (H2 in-memory, MySQL compatible) ───
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA ───
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ─── FLYWAY (disabled for tests — H2 handles schema) ───
spring.flyway.enabled=false

# ─── JWT ───
app.jwt.secret=ThisIsAVeryLongSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHS256!
app.jwt.expiration-ms=86400000

# ─── UPLOAD ───
app.upload.dir=target/test-uploads
app.upload.url-prefix=/api/cars

# ─── RATE LIMIT (very high for tests so they never hit) ───
app.rate-limit.public.capacity=100000
app.rate-limit.public.refill-per-minute=100000
app.rate-limit.auth.capacity=100000
app.rate-limit.auth.refill-per-minute=100000
app.rate-limit.admin.capacity=100000
app.rate-limit.admin.refill-per-minute=100000
app.rate-limit.upload.capacity=100000
app.rate-limit.upload.refill-per-minute=100000

# ─── LOGGING ───
logging.level.root=WARN
logging.level.com.Luxurycars.carstore=INFO