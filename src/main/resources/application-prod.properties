# ─── SERVER ───
server.port=${PORT:8080}

# ─── MYSQL (Supports DB_* custom vars, Railway's native MYSQL* vars, or direct MYSQL_URL / DATABASE_URL) ───
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DATABASE:railway}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── HIKARI CONNECTION POOL ───
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ─── JPA (Flyway manages schema) ───
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── FLYWAY ───
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── JWT ───
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHS256!}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ─── FILE UPLOAD ───
app.upload.dir=${UPLOAD_DIR:/app/uploads/cars}
app.upload.url-prefix=/api/cars

# ─── RATE LIMIT ───
app.rate-limit.public.capacity=60
app.rate-limit.public.refill-per-minute=60
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-per-minute=10
app.rate-limit.admin.capacity=30
app.rate-limit.admin.refill-per-minute=30
app.rate-limit.upload.capacity=5
app.rate-limit.upload.refill-per-minute=5

# ─── LOGGING ───
logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.com.Luxurycars.carstore=INFO

# ─── ACTUATOR ───
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─── REDIS (Supports REDIS_URL, REDIS_PRIVATE_URL, or Railway's native REDIS* env vars) ───
spring.data.redis.url=${REDIS_URL:${REDIS_PRIVATE_URL:redis://${REDIS_HOST:${REDISHOST:localhost}}:${REDIS_PORT:${REDISPORT:6379}}}}
spring.data.redis.host=${REDIS_HOST:${REDISHOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${REDISPORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:${REDISPASSWORD:}}
spring.data.redis.username=${REDIS_USER:${REDISUSER:default}}

# ─── MONGODB (Supports SPRING_DATA_MONGODB_URI, SPRING_MONGODB_URI, MONGODB_URI, or Docker mongo service) ───
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:${MONGODB_URI:mongodb://mongo:27017/carstore_audit}}}
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.auto-index-creation=true