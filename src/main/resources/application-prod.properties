# ─── SERVER ───
server.port=${PORT:8080}

# ─── MYSQL (Supports DB_* custom vars OR Railway's native MYSQL* vars) ───
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── HIKARI CONNECTION POOL ───
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ─── JPA (Flyway manages schema) ───
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── FLYWAY ───
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── JWT ───
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHS256!}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ─── FILE UPLOAD ───
app.upload.dir=${UPLOAD_DIR:/app/uploads/cars}
app.upload.url-prefix=/api/cars

# ─── RATE LIMIT ───
app.rate-limit.public.capacity=60
app.rate-limit.public.refill-per-minute=60
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-per-minute=10
app.rate-limit.admin.capacity=30
app.rate-limit.admin.refill-per-minute=30
app.rate-limit.upload.capacity=5
app.rate-limit.upload.refill-per-minute=5

# ─── LOGGING ───
logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.com.Luxurycars.carstore=INFO

# ─── ACTUATOR ───
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never