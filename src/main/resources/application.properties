# ─── SHARED SETTINGS (dev + prod) ───
spring.application.name=carstore

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Disable Open Session In View (best practice)
spring.jpa.open-in-view=false

# Default profile if none specified (change to "prod" when deploying)
spring.profiles.active=dev

# ─── REDIS CONFIGURATION ───
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ─── MONGODB CONFIGURATION (Polyglot Audit & Telemetry) ───
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/carstore_audit}}}
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.auto-index-creation=true

# ─── TELEGRAM INSTANT NOTIFICATION BOT (100% Free) ───
app.telegram.enabled=${TELEGRAM_ENABLED:false}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}