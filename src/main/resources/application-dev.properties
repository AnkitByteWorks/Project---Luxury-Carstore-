# ─── SERVER ───
server.port=8080

# ─── MYSQL (DEVELOPMENT) ───
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/luxury_cars_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:719438}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA (validate — Flyway manages schema) ───
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── FLYWAY ───
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ─── LOGGING ───
logging.config=classpath:logback-spring.xml
logging.level.org.flywaydb=DEBUG
#                    ↑ This makes Flyway print lots of info — helps debugging

//app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHS256!}
//app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
//# ─── JWT ───
app.jwt.secret=ThisIsAVeryLongSecretKeyForJwtSigningMustBeAtLeast32BytesLongForHS256!
app.jwt.expiration-ms=86400000

# ─── FILE UPLOAD ───
app.upload.dir=uploads/cars
app.upload.url-prefix=/api/cars

# ─── RATE LIMITING ───
app.rate-limit.public.capacity=60
app.rate-limit.public.refill-per-minute=60

app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-per-minute=10

app.rate-limit.admin.capacity=30
app.rate-limit.admin.refill-per-minute=30

app.rate-limit.upload.capacity=5
app.rate-limit.upload.refill-per-minute=5