name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test on Java 25
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. Setup JDK 25 ───
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # ─── 3. Display versions (debug) ───
      - name: Verify Java version
        run: java -version

      - name: Verify Maven version
        run: mvn -version

      # ─── 4. Cache Maven dependencies ───
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ─── 5. Compile ───
      - name: Compile
        run: mvn clean compile -B

      # ─── 6. Run tests ───
      - name: Run tests
        run: mvn test -B

      # ─── 7. Package JAR ───
      - name: Package
        run: mvn package -DskipTests -B

      # ─── 8. Upload test reports (even on failure) ───
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      # ─── 9. Upload JAR artifact ───
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: carstore-jar
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test   # ← only run if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: carstore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
